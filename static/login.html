<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community360 | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <div class="brand-mark">C360</div>
      <div class="login-brand-copy">
        <h1>Community360</h1>
        <p class="brand-subtitle">Acceso seguro al panel</p>
      </div>
    </div>

    <div class="login-heading">
      <span class="eyebrow">ACCESO EJECUTIVO</span>
      <h2>Iniciar sesión</h2>
      <p>Ingresa con tu cuenta autorizada para acceder al dashboard.</p>
    </div>

    <div id="loginError" class="error"></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary login-btn" type="submit" id="loginBtn">Entrar</button>
    </form>
    <div class="footer-note">La autenticación usa JWT y credenciales verificadas en Cloudflare D1.</div>
  </main>
  <script>
    const API_BASE = '';
    const token = sessionStorage.getItem('c360_token');
    if (token) {
      fetch(`${API_BASE}/api/auth/verify`, { headers: { 'Authorization': `Bearer ${token}` } })
        .then(r => { if (r.ok) window.location.href = '/static/dashboard.html'; })
        .catch(() => {});
    }

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.className = 'error';
      errorBox.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        errorBox.textContent = 'Usuario y contraseña son obligatorios.';
        errorBox.classList.add('show');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Verificando...';
      try {
        const resp = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          throw new Error(data.detail || 'No se pudo iniciar sesión.');
        }
        sessionStorage.setItem('c360_token', data.access_token);
        sessionStorage.setItem('c360_user', JSON.stringify(data.usuario || {}));
        window.location.href = '/static/dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message || 'Error de autenticación.';
        errorBox.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
