<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community360 | Iniciar sesión</title>
  <script src="/static/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/login.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <canvas id="fondoActividad" aria-hidden="true"></canvas>
  <div class="velo" aria-hidden="true"></div>
  <header class="marca"><span class="marca-logo">C360</span><span class="marca-nombre">Community360</span></header>
  <button id="themeToggleBtn" class="btn-tema" type="button" aria-label="Cambiar tema">
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
    <span class="theme-label">Modo claro</span>
  </button>
  <main class="login-zona">
    <section class="tarjeta" aria-labelledby="tituloLogin">
      <p class="eyebrow">ACCESO SEGURO</p>
      <h1 id="tituloLogin">Iniciar sesión</h1>
      <p class="sub">Panel de la comunidad. Solo para administradores autorizados.</p>
      <form id="loginForm" novalidate>
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="254" spellcheck="false" autocapitalize="off" required>
        <label for="password">Contraseña</label>
        <div class="campo-pass">
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
          <button id="passwordToggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="icon icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="2.8"></circle></svg>
            <svg class="icon icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.7"></path><path d="M6.2 7.8A16 16 0 0 0 2.5 12S6 18 12 18a9.6 9.6 0 0 0 3.4-.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
          </button>
        </div>
        <p id="loginError" class="error login-error" role="alert"></p>
        <button id="loginBtn" type="submit" class="btn-entrar">Entrar</button>
      </form>
      <p class="pie">Acceso protegido · Sesión de 180 min</p>
    </section>
  </main>

  <script src="/static/login.js"></script>
  <script src="/static/login-fondo.js"></script>
</body>
</html>
