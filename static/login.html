<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community360 | Iniciar sesión</title>
  <script>
    (function () {
      var theme = 'dark';
      try { theme = localStorage.getItem('c360_theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07090D;--tarjeta:rgba(11,15,21,.82);--borde:#1E2935;--borde-2:#2A3A4E;--texto:#E6EDF5;--texto-2:#9AA7B6;--texto-3:#5F6B7A;--acento:#8FB3E0;--sobre-acento:#07090D;--campo:#0E141C;--error:#E39A9A;--velo:linear-gradient(90deg,rgba(7,9,13,0) 35%,rgba(7,9,13,.75) 70%,rgba(7,9,13,.92))}
    [data-theme="light"]{--bg:#F3F5F8;--tarjeta:rgba(255,255,255,.86);--borde:#D9DFE7;--borde-2:#C3CCD8;--texto:#111821;--texto-2:#4A5666;--texto-3:#7A8594;--acento:#34547F;--sobre-acento:#FFFFFF;--campo:#FFFFFF;--error:#B03A3A;--velo:linear-gradient(90deg,rgba(243,245,248,0) 35%,rgba(243,245,248,.75) 70%,rgba(243,245,248,.92))}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--texto);font-family:Inter,system-ui,sans-serif;overflow:hidden}
    #fondoActividad{position:fixed;inset:0;z-index:0;display:block}
    .velo{position:fixed;inset:0;z-index:1;background:var(--velo);pointer-events:none}
    .marca{position:fixed;top:28px;left:32px;z-index:2;display:flex;align-items:center;gap:10px}
    .marca-logo{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--acento);border:1px solid var(--borde-2);border-radius:6px;padding:4px 7px}
    .marca-nombre{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;letter-spacing:.01em}
    .btn-tema{position:fixed;top:24px;right:28px;z-index:2;width:38px;height:38px;border-radius:8px;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto-2);cursor:pointer}
    .btn-tema:hover{color:var(--texto);border-color:var(--borde-2)}
    /* Contenido heredado del botón de tema: íconos sol/luna y la etiqueta que actualiza el script. */
    .btn-tema{display:grid;place-items:center;padding:0}
    .btn-tema .icon{width:17px;height:17px}
    .btn-tema .icon-sun{display:none}
    [data-theme="light"] .btn-tema .icon-sun{display:block}
    [data-theme="light"] .btn-tema .icon-moon{display:none}
    .btn-tema .theme-label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    .login-zona{position:relative;z-index:2;min-height:100%;display:flex;align-items:center;justify-content:flex-end;padding:32px clamp(24px,8vw,140px)}
    .tarjeta{width:min(404px,100%);padding:36px 34px 28px;border-radius:14px;background:var(--tarjeta);border:1px solid var(--borde);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.35)}
    .eyebrow{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--acento)}
    .tarjeta h1{margin:0 0 8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:28px}
    .sub{margin:0 0 26px;font-size:14px;line-height:1.5;color:var(--texto-2)}
    #loginForm label{display:block;margin:0 0 7px;font-size:13px;font-weight:500;color:var(--texto-2)}
    #loginForm input{width:100%;height:44px;padding:0 14px;margin:0 0 18px;border-radius:8px;border:1px solid var(--borde);background:var(--campo);color:var(--texto);font:inherit;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
    #loginForm input:focus{border-color:var(--acento);box-shadow:0 0 0 3px rgba(143,179,224,.18)}
    .campo-pass{position:relative}
    .campo-pass input{padding-right:46px}
    #passwordToggle{position:absolute;right:6px;top:6px;width:34px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--texto-3);cursor:pointer}
    #passwordToggle:hover{color:var(--texto)}
    /* El script alterna la clase is-visible en #passwordToggle: ojo abierto ↔ ojo tachado. */
    #passwordToggle{display:grid;place-items:center;padding:0}
    #passwordToggle .icon{width:18px;height:18px}
    #passwordToggle .icon-eye-off{display:none}
    #passwordToggle.is-visible .icon-eye{display:none}
    #passwordToggle.is-visible .icon-eye-off{display:block}
    /* El script reemplaza className por 'error' y añade 'show' para mostrarlo; por eso el estilo va por id. */
    #loginError{display:none;min-height:0;margin:-6px 0 14px;font-size:13px;color:var(--error)}
    #loginError.show{display:block}
    .btn-entrar{position:relative;overflow:hidden;width:100%;height:46px;border:0;border-radius:8px;background:var(--acento);color:var(--sobre-acento);font:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:filter .2s,transform .1s}
    .btn-entrar::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
    .btn-entrar:hover::after{left:120%}
    .btn-entrar:hover{filter:brightness(1.06)}
    .btn-entrar:active{transform:scale(.99)}
    .btn-entrar:disabled{opacity:.6;cursor:wait}
    .pie{margin:22px 0 0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--texto-3)}
    @media (max-width:820px){.login-zona{justify-content:center}.velo{background:rgba(7,9,13,.55)}[data-theme="light"] .velo{background:rgba(243,245,248,.6)}.marca{top:20px;left:20px}.btn-tema{top:16px;right:16px}}
    @media (prefers-reduced-motion:reduce){.btn-entrar::after{display:none}*{transition:none!important}}
  </style>
</head>
<body>
  <canvas id="fondoActividad" aria-hidden="true"></canvas>
  <div class="velo" aria-hidden="true"></div>
  <header class="marca"><span class="marca-logo">C360</span><span class="marca-nombre">Community360</span></header>
  <button id="themeToggleBtn" class="btn-tema" type="button" aria-label="Cambiar tema">
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
    <span class="theme-label">Modo Claro</span>
  </button>
  <main class="login-zona">
    <section class="tarjeta" aria-labelledby="tituloLogin">
      <p class="eyebrow">ACCESO SEGURO</p>
      <h1 id="tituloLogin">Iniciar sesión</h1>
      <p class="sub">Panel de la comunidad. Solo para administradores autorizados.</p>
      <form id="loginForm" novalidate>
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <div class="campo-pass">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="passwordToggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="icon icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="2.8"></circle></svg>
            <svg class="icon icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.7"></path><path d="M6.2 7.8A16 16 0 0 0 2.5 12S6 18 12 18a9.6 9.6 0 0 0 3.4-.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
          </button>
        </div>
        <p id="loginError" class="error login-error" role="alert"></p>
        <button id="loginBtn" type="submit" class="btn-entrar">Entrar</button>
      </form>
      <p class="pie">Acceso protegido · Sesión de 180 min</p>
    </section>
  </main>

  <script>
    (function () {
      var btn = document.getElementById('themeToggleBtn');
      if (!btn) return;
      var label = btn.querySelector('.theme-label');
      function sync() {
        var light = document.documentElement.getAttribute('data-theme') === 'light';
        if (label) label.textContent = light ? 'Modo Oscuro' : 'Modo Claro';
        btn.setAttribute('aria-label', light ? 'Activar modo oscuro' : 'Activar modo claro');
        btn.setAttribute('aria-pressed', String(light));
      }
      sync();
      btn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('c360_theme', next); } catch (e) {}
        sync();
      });
    })();
  </script>
  <script>
    (function () {
      var toggle = document.getElementById('passwordToggle');
      var input = document.getElementById('password');
      if (!toggle || !input) return;
      toggle.addEventListener('click', function () {
        var visible = input.type === 'password';
        input.type = visible ? 'text' : 'password';
        toggle.classList.toggle('is-visible', visible);
        toggle.setAttribute('aria-pressed', String(visible));
        toggle.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
        input.focus();
      });
    })();
  </script>
  <script>
    (function () {
      const API_BASE = '';
      // /dashboard manda aquí con ?sesion=expirada cuando no hay cookie de sesión válida:
      // se limpia la sesión local para no rebotar entre login y dashboard.
      const sesionExpirada = new URLSearchParams(window.location.search).has('sesion');
      if (sesionExpirada) {
        try { sessionStorage.removeItem('c360_token'); sessionStorage.removeItem('c360_user'); } catch (e) {}
      }
      const token = sesionExpirada ? null : sessionStorage.getItem('c360_token');
      if (token) {
        fetch(`${API_BASE}/api/auth/verify`, { headers: { 'Authorization': `Bearer ${token}` } })
          .then(r => { if (r.ok) window.location.href = '/dashboard'; })
          .catch(() => {});
      }

      const form = document.getElementById('loginForm');
      const errorBox = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      if (!form || !errorBox || !btn || !usernameInput || !passwordInput) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.className = 'error';
        errorBox.textContent = '';
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) {
          errorBox.textContent = 'Usuario y contraseña son obligatorios.';
          errorBox.classList.add('show');
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Verificando...';
        try {
          const resp = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) {
            throw new Error(resp.status === 429 ? 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.' : (typeof data.detail === 'string' ? data.detail : 'Usuario o contraseña incorrectos.'));
          }
          sessionStorage.setItem('c360_token', data.access_token);
          sessionStorage.setItem('c360_user', JSON.stringify(data.usuario || {}));
          window.location.href = '/dashboard';
        } catch (err) {
          errorBox.textContent = err.message || 'Error de autenticación.';
          errorBox.classList.add('show');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      });
    })();
  </script>
  <script src="/static/login-fondo.js"></script>
</body>
</html>
