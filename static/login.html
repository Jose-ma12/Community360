<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community360 | Iniciar sesión</title>
  <script>
    (function () {
      var theme = 'dark';
      try { theme = localStorage.getItem('c360_theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&amp;family=JetBrains+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
  <button id="themeToggleBtn" class="theme-toggle login-theme-toggle" type="button" aria-label="Cambiar tema">
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
    <span class="theme-label">Modo claro</span>
  </button>
  <main class="login-card">
    <div class="login-brand">
      <div class="brand-mark">C360</div>
      <div class="login-brand-copy">
        <h1>Community360</h1>
        <p class="brand-subtitle">Acceso seguro al panel</p>
      </div>
    </div>

    <div class="login-heading">
      <h2>Iniciar sesión</h2>
      <p>Ingresa con tu cuenta autorizada para acceder al dashboard.</p>
    </div>

    <div id="loginError" class="error"></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary login-btn" type="submit" id="loginBtn">Entrar</button>
    </form>
    <div class="footer-note">La autenticación usa JWT y credenciales verificadas en Cloudflare D1.</div>
  </main>
  <script>
    (function () {
      var btn = document.getElementById('themeToggleBtn');
      if (!btn) return;
      var label = btn.querySelector('.theme-label');
      function sync() {
        var light = document.documentElement.getAttribute('data-theme') === 'light';
        if (label) label.textContent = light ? 'Modo oscuro' : 'Modo claro';
        btn.setAttribute('aria-label', light ? 'Activar modo oscuro' : 'Activar modo claro');
        btn.setAttribute('aria-pressed', String(light));
      }
      sync();
      btn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('c360_theme', next); } catch (e) {}
        sync();
      });
    })();
  </script>
  <script>
    const API_BASE = '';
    const token = sessionStorage.getItem('c360_token');
    if (token) {
      fetch(`${API_BASE}/api/auth/verify`, { headers: { 'Authorization': `Bearer ${token}` } })
        .then(r => { if (r.ok) window.location.href = '/static/dashboard.html'; })
        .catch(() => {});
    }

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.className = 'error';
      errorBox.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        errorBox.textContent = 'Usuario y contraseña son obligatorios.';
        errorBox.classList.add('show');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Verificando...';
      try {
        const resp = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          throw new Error(data.detail || 'No se pudo iniciar sesión.');
        }
        sessionStorage.setItem('c360_token', data.access_token);
        sessionStorage.setItem('c360_user', JSON.stringify(data.usuario || {}));
        window.location.href = '/static/dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message || 'Error de autenticación.';
        errorBox.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
